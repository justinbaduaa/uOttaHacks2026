AWSTemplateFormatVersion: 2010-09-09
Transform: AWS::Serverless-2016-10-31
Description: Glass Box Collaborative Canvas Backend

Parameters:
  GatewayApiBaseUrl:
    Type: String
    Default: ""
  GatewaySharedSecret:
    Type: String
    Default: ""

Globals:
  Function:
    Runtime: python3.13
    Timeout: 30
    MemorySize: 512
    Environment:
      Variables:
        CANVAS_TABLE: !Ref CanvasTable
        NODES_TABLE: !Ref NodesTable
        FILES_BUCKET: !Ref FilesBucket
        USER_POOL_ID: !Ref UserPool
        GATEWAY_API_BASE_URL: !Ref GatewayApiBaseUrl
        GATEWAY_SHARED_SECRET: !Ref GatewaySharedSecret

Resources:
  # Cognito User Pool
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: GlassBoxUserPool
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: GlassBoxClient
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      SupportedIdentityProviders:
        - COGNITO
      CallbackURLs:
        - http://localhost:5173/
        - http://localhost:5173
        - http://localhost:8787/callback
      LogoutURLs:
        - http://localhost:5173/
        - http://localhost:8787
      PreventUserExistenceErrors: ENABLED

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub glassbox-${AWS::AccountId}-${AWS::Region}
      UserPoolId: !Ref UserPool

  # DynamoDB Tables
  CanvasTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: GlassBoxCanvasTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: joinCode
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: JoinCodeIndex
          KeySchema:
            - AttributeName: joinCode
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  NodesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: GlassBoxNodesTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # S3 Bucket
  FilesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub glassbox-files-${AWS::AccountId}-${AWS::Region}
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - GET
              - PUT
              - HEAD
            AllowedOrigins:
              - "*"
            ExposedHeaders:
              - ETag
            MaxAge: 3000
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldVersions
            Status: Enabled
            NoncurrentVersionExpirationInDays: 30

  # API Gateway HTTP API
  ApiGateway:
    Type: AWS::Serverless::HttpApi
    Properties:
      Auth:
        Authorizers:
          CognitoAuthorizer:
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
              audience:
                - !Ref UserPoolClient
            IdentitySource: "$request.header.Authorization"
        DefaultAuthorizer: CognitoAuthorizer

  # Lambda Functions
  CreateCanvasFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: GlassBoxCreateCanvas
      CodeUri: src/
      Handler: handlers.canvases.create_canvas
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGateway
            Method: post
            Path: /canvases
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CanvasTable

  JoinCanvasFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: GlassBoxJoinCanvas
      CodeUri: src/
      Handler: handlers.canvases.join_canvas
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGateway
            Method: post
            Path: /canvases/join
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CanvasTable

  ListCanvasesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: GlassBoxListCanvases
      CodeUri: src/
      Handler: handlers.canvases.list_canvases
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGateway
            Method: get
            Path: /canvases
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref CanvasTable

  GetCanvasEvidenceFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: GlassBoxGetCanvasEvidence
      CodeUri: src/
      Handler: handlers.canvases.get_canvas_evidence
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGateway
            Method: get
            Path: /canvases/{canvasId}/evidence
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref CanvasTable

  UpdateCanvasEvidenceFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: GlassBoxUpdateCanvasEvidence
      CodeUri: src/
      Handler: handlers.canvases.update_canvas_evidence
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGateway
            Method: patch
            Path: /canvases/{canvasId}/evidence
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CanvasTable

  GetNodesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: GlassBoxGetNodes
      CodeUri: src/
      Handler: handlers.nodes.get_nodes
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGateway
            Method: get
            Path: /nodes
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref NodesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref CanvasTable

  GetNodeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: GlassBoxGetNode
      CodeUri: src/
      Handler: handlers.nodes.get_node_by_id
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGateway
            Method: get
            Path: /nodes/{nodeId}
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref NodesTable
        - DynamoDBReadPolicy:
            TableName: !Ref CanvasTable

  CreateNodeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: GlassBoxCreateNode
      CodeUri: src/
      Handler: handlers.nodes.create_node
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGateway
            Method: post
            Path: /nodes
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref NodesTable
        - DynamoDBReadPolicy:
            TableName: !Ref CanvasTable

  UpdateNodeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: GlassBoxUpdateNode
      CodeUri: src/
      Handler: handlers.nodes.update_node
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGateway
            Method: patch
            Path: /nodes/{nodeId}
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref NodesTable
        - DynamoDBReadPolicy:
            TableName: !Ref CanvasTable

  DeleteNodeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: GlassBoxDeleteNode
      CodeUri: src/
      Handler: handlers.nodes.delete_node
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGateway
            Method: delete
            Path: /nodes/{nodeId}
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref NodesTable
        - DynamoDBReadPolicy:
            TableName: !Ref CanvasTable
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - s3:DeleteObject
                - s3:DeleteObjectVersion
              Resource: !Sub arn:${AWS::Partition}:s3:::${FilesBucket}/*

  ExecuteNodeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: GlassBoxExecuteNode
      CodeUri: src/
      Handler: handlers.nodes.execute_node
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGateway
            Method: post
            Path: /nodes/{nodeId}/execute
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref NodesTable
        - DynamoDBReadPolicy:
            TableName: !Ref CanvasTable

  ApproveNodeActionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: GlassBoxApproveNodeAction
      CodeUri: src/
      Handler: handlers.nodes.approve_node_action
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGateway
            Method: post
            Path: /nodes/{nodeId}/approve
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref NodesTable
        - DynamoDBReadPolicy:
            TableName: !Ref CanvasTable

  PresignFileFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: GlassBoxPresignFile
      CodeUri: src/
      Handler: handlers.files.presign_file
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGateway
            Method: post
            Path: /files/presign
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref NodesTable
        - DynamoDBReadPolicy:
            TableName: !Ref CanvasTable
        - S3WritePolicy:
            BucketName: !Ref FilesBucket

  CompleteFileFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: GlassBoxCompleteFile
      CodeUri: src/
      Handler: handlers.files.complete_file
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGateway
            Method: post
            Path: /files/complete
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref NodesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref CanvasTable

  DownloadFileFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: GlassBoxDownloadFile
      CodeUri: src/
      Handler: handlers.files.download_file
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGateway
            Method: post
            Path: /files/download
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref NodesTable
        - DynamoDBReadPolicy:
            TableName: !Ref CanvasTable
        - S3ReadPolicy:
            BucketName: !Ref FilesBucket

  LeavePresenceFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: GlassBoxLeavePresence
      CodeUri: src/
      Handler: handlers.presence.leave_presence
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGateway
            Method: post
            Path: /presence/leave
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CanvasTable

  PresignDownloadFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: GlassBoxPresignDownload
      CodeUri: src/
      Handler: handlers.files.presign_download
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGateway
            Method: post
            Path: /files/presign-download
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref NodesTable
        - DynamoDBReadPolicy:
            TableName: !Ref CanvasTable
        - S3ReadPolicy:
            BucketName: !Ref FilesBucket

Outputs:
  ApiUrl:
    Description: API Gateway HTTP API URL
    Value: !Sub https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com
  HostedUiDomain:
    Description: Cognito Hosted UI domain
    Value: !Sub https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com
  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref UserPoolClient
  FilesBucketName:
    Description: S3 Bucket for file uploads
    Value: !Ref FilesBucket
