<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline' https://unpkg.com; img-src 'self' data:;"
    />
    <title>Glass Box</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/main.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body>
    <div id="app">
      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <div class="logo">
            <img src="glassbox logo.png" alt="glassbox" class="logo-icon" />
            <span class="logo-text">glassbox</span>
          </div>
        </div>

        <div class="project-selector">
          <div class="project-avatar">sb</div>
          <span class="project-name">secondbrain V1</span>
          <i
            data-lucide="chevron-down"
            class="dropdown-icon"
            style="width: 12px; height: 12px"
          ></i>
        </div>

        <div class="sidebar-separator"></div>

        <nav class="sidebar-nav">
          <a href="#" class="nav-item active">
            <i data-lucide="compass" width="18" height="18"></i>
            <span>Explorer</span>
          </a>
          <a href="#" class="nav-item">
            <i data-lucide="package" width="18" height="18"></i>
            <span>My Boxes</span>
          </a>
        </nav>

        <div class="sidebar-separator"></div>

        <div class="sidebar-section">
          <div class="section-header">
            <span>CANVASES</span>
          </div>
          <div class="glass-boxes-list" id="sidebarBoxesList">
            <!-- Populated by JS -->
          </div>
          <div class="canvas-create" id="canvasCreate">
            <button class="canvas-create-toggle" id="canvasCreateToggle">
              <span class="canvas-create-icon" aria-hidden="true">
                <i data-lucide="plus" width="16" height="16"></i>
              </span>
              <div class="canvas-create-text">
                <span class="canvas-create-title">New canvas</span>
                <span class="canvas-create-subtitle"
                  >Start a blank workspace</span
                >
              </div>
            </button>
            <div class="canvas-create-form" id="canvasCreateForm">
              <input
                type="text"
                id="canvasCreateInput"
                class="canvas-create-input"
                placeholder="Name your canvas..."
                maxlength="40"
              />
              <div class="canvas-create-actions">
                <button class="canvas-create-submit" id="canvasCreateSubmit">
                  Create
                </button>
                <button class="canvas-create-cancel" id="canvasCreateCancel">
                  Cancel
                </button>
              </div>
              <div class="canvas-create-error" id="canvasCreateError"></div>
            </div>
          </div>
        </div>
      </aside>

      <!-- Main Content -->
      <main class="main-content">
        <header class="main-header">
          <nav class="breadcrumb" id="breadcrumb">
            <button class="breadcrumb-item active" data-id="root">
              Workspace
            </button>
          </nav>
          <div class="header-actions">
            <button
              class="profile-chip"
              id="userProfile"
              aria-label="User profile"
            >
              <span class="profile-letter" id="userProfileLetter">?</span>
            </button>
          </div>
        </header>

        <!-- Canvas Container -->
        <div class="canvas-container" id="canvasContainer">
          <div class="canvas" id="canvas">
            <!-- Nodes will be rendered here -->
          </div>
          <div class="canvas-loading" id="canvasLoading" hidden>
            <div class="spinner"></div>
            <span>Loading nodes...</span>
          </div>
          <div
            class="node-create-popover"
            id="nodeCreatePopover"
            aria-hidden="true"
          >
            <button
              class="node-create-action"
              id="nodeCreateConfirm"
              type="button"
            >
              <span class="node-create-action-label">Create new task</span>
            </button>
            <div class="node-create-error" id="nodeCreateError"></div>
          </div>
          <div
            class="node-delete-popover"
            id="nodeDeletePopover"
            aria-hidden="true"
          >
            <div class="node-delete-label" id="nodeDeleteLabel">Delete?</div>
            <div class="node-delete-subtitle">
              This removes the node and any subtasks.
            </div>
            <button
              class="node-delete-action"
              id="nodeDeleteConfirm"
              type="button"
            >
              Delete
            </button>
            <div class="node-delete-error" id="nodeDeleteError"></div>
          </div>
          <div class="canvas-toast" id="canvasToast" aria-live="polite"></div>
        </div>
      </main>
    </div>

    <script src="js/canvas.js"></script>
    <script>
      lucide.createIcons();
    </script>
  </body>
</html>
