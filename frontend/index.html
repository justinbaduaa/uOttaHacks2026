<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self';"
    />
    <title>Glass Box</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/main.css" />
  </head>
  <body>
    <div id="app">
      <!-- Header -->
      <header class="header">
        <div class="header-left">
          <div class="logo">
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <rect
                x="3"
                y="3"
                width="18"
                height="18"
                rx="2"
                ry="2"
                opacity="0.4"
              />
              <rect x="7" y="7" width="10" height="10" rx="1" ry="1" />
            </svg>
            <span>Glass Box</span>
          </div>

          <!-- Breadcrumb Navigation -->
          <nav class="breadcrumb" id="breadcrumb">
            <button class="breadcrumb-item active" data-id="root">
              <svg
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
              </svg>
              Workspace
            </button>
          </nav>
        </div>

        <div class="header-right">
          <button class="header-btn" id="captureBtn" title="Capture Evidence">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M12 5v14M5 12h14" />
            </svg>
          </button>
        </div>
      </header>

      <!-- Main Content -->
      <main class="main">
        <!-- Canvas Explorer -->
        <div class="canvas-container" id="canvasContainer">
          <div class="canvas" id="canvas">
            <!-- Glass Box nodes will be rendered here -->
          </div>
        </div>

        <!-- Detail Panel -->
        <aside class="detail-panel" id="detailPanel">
          <div class="detail-header">
            <button class="back-btn" id="backBtn">
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M19 12H5M12 19l-7-7 7-7" />
              </svg>
            </button>
            <div class="detail-title">
              <h2 id="detailName">Node Name</h2>
              <div class="author-badge" id="detailAuthor">
                <span class="avatar">AB</span>
                <span>Author Name</span>
              </div>
            </div>
          </div>

          <div class="detail-body">
            <!-- Goal Section -->
            <section class="detail-section">
              <h3 class="section-title">
                <svg
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <circle cx="12" cy="12" r="10" />
                  <circle cx="12" cy="12" r="6" />
                  <circle cx="12" cy="12" r="2" />
                </svg>
                Goal
              </h3>
              <p class="section-content" id="detailGoal"></p>
            </section>

            <!-- Result Section -->
            <section class="detail-section">
              <h3 class="section-title">
                <svg
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <polyline points="20 6 9 17 4 12" />
                </svg>
                Result
              </h3>
              <div class="result-box" id="detailResult"></div>
            </section>

            <!-- Execution Log -->
            <section class="detail-section">
              <h3 class="section-title">
                <svg
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path
                    d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
                  />
                  <polyline points="14 2 14 8 20 8" />
                  <line x1="16" y1="13" x2="8" y2="13" />
                  <line x1="16" y1="17" x2="8" y2="17" />
                </svg>
                Execution Log
              </h3>
              <div class="evidence-list" id="evidenceList">
                <!-- Evidence items rendered here -->
              </div>
            </section>

            <!-- Nested Boxes -->
            <section class="detail-section">
              <h3 class="section-title">
                <svg
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <rect
                    x="3"
                    y="3"
                    width="18"
                    height="18"
                    rx="2"
                    ry="2"
                    opacity="0.4"
                  />
                  <rect x="7" y="7" width="10" height="10" rx="1" ry="1" />
                </svg>
                Nested Boxes
              </h3>
              <div class="nested-list" id="nestedList">
                <!-- Nested boxes rendered here -->
              </div>
            </section>
          </div>
        </aside>
      </main>

      <!-- Capture Modal -->
      <div class="modal-overlay" id="captureModal">
        <div class="modal">
          <div class="modal-header">
            <h3>Capture Evidence</h3>
            <button class="modal-close" id="closeCaptureModal">
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M18 6L6 18M6 6l12 12" />
              </svg>
            </button>
          </div>
          <div class="modal-body">
            <!-- Drop Zone -->
            <div class="drop-zone" id="dropZone">
              <svg
                width="48"
                height="48"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
              >
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                <polyline points="17 8 12 3 7 8" />
                <line x1="12" y1="3" x2="12" y2="15" />
              </svg>
              <p>Drop files or links here</p>
              <span>or click to browse</span>
            </div>

            <!-- Quick Note -->
            <div class="quick-note">
              <input
                type="text"
                id="noteInput"
                placeholder="Add a quick note..."
              />
              <button class="note-submit" id="noteSubmit">
                <svg
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <line x1="22" y1="2" x2="11" y2="13" />
                  <polygon points="22 2 15 22 11 13 2 9 22 2" />
                </svg>
              </button>
            </div>

            <!-- Target Selector -->
            <div class="target-select-wrapper">
              <label>Add to Glass Box:</label>
              <select id="targetSelect">
                <option value="">Select target...</option>
              </select>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
