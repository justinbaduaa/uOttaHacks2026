<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; img-src 'self' data:;"
    />
    <title>Glass Box</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/main.css" />
  </head>
  <body>
    <div id="app">
      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <div class="logo">
            <img src="glassbox logo.png" alt="glassbox" class="logo-icon" />
            <span class="logo-text">glassbox</span>
          </div>
        </div>

        <div class="project-selector">
          <div class="project-avatar">sb</div>
          <span class="project-name">secondbrain V1</span>
          <svg class="dropdown-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 9l6 6 6-6"/>
          </svg>
        </div>

        <div class="sidebar-separator"></div>

        <nav class="sidebar-nav">
          <a href="#" class="nav-item active">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
              <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
            <span>Explorer</span>
          </a>
          <a href="#" class="nav-item">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
              <polyline points="22 4 12 14.01 9 11.01"/>
            </svg>
            <span>My Boxes</span>
          </a>
        </nav>

        <div class="sidebar-separator"></div>

        <div class="sidebar-section">
          <div class="section-header">
            <span>GLASS BOXES</span>
            <button class="add-btn">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="8" x2="12" y2="16"/>
                <line x1="8" y1="12" x2="16" y2="12"/>
              </svg>
            </button>
          </div>
          <div class="glass-boxes-list" id="sidebarBoxesList">
            <!-- Populated by JS -->
          </div>
        </div>
      </aside>

      <!-- Main Content -->
      <main class="main-content">
        <header class="main-header">
          <nav class="breadcrumb" id="breadcrumb">
            <button class="breadcrumb-item active" data-id="root">Workspace</button>
          </nav>
        </header>

        <!-- Canvas Container -->
        <div class="canvas-container" id="canvasContainer">
          <div class="canvas" id="canvas">
            <!-- Nodes will be rendered here -->
          </div>
        </div>
      </main>
    </div>

    <script src="js/data.js"></script>
    <script src="js/canvas.js"></script>
  </body>
</html>
