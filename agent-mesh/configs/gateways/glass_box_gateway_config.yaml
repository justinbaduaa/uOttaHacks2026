# Solace Agent Mesh: glass_box_gateway Gateway Configuration

log:
  stdout_log_level: INFO
  log_file_level: DEBUG
  log_file: "glass_box_gateway_gateway.log"

!include ../shared_config.yaml

apps:
  - name: glass_box_gateway_gateway_app
    app_base_path: .
    app_module: src.glass_box_gateway.app

    broker:
      <<: *broker_connection

    app_config:
      namespace: ${NAMESPACE}
      gateway_id: glass-box-gateway-gw-01

      artifact_service: *default_artifact_service

      system_purpose: >
        The system coordinates human-defined tasks with agents.
        Humans define nodes and inputs, then assign agents and execute.
        Agents must produce evidence for agent-assigned tasks and provide
        status updates before tool calls or approvals.
        Always keep the workflow auditable and explicit.

      response_format: >
        Responses should be concise, action-oriented, and auditable.
        Use Markdown and include approvals/evidence summaries when relevant.

      
      # enable_embed_resolution: true # Default is true
      # gateway_artifact_content_limit_bytes: 10485760 # 10MB
      # gateway_recursive_embed_depth: 3

      # --- GlassBoxGateway Specific Parameters ---
      gateway_host: "${PLATFORM_API_HOST, 127.0.0.1}"
      gateway_port: ${PLATFORM_API_PORT, 8001}
      gateway_shared_secret: "${GLASSBOX_GATEWAY_SHARED_SECRET, \"\"}"

      backend_api_base_url: "${GLASSBOX_API_BASE_URL}"
      backend_auth_mode: "${GLASSBOX_BACKEND_AUTH_MODE, service_token}"
      backend_service_token: "${GLASSBOX_SERVICE_TOKEN}"
      backend_timeout_seconds: ${GLASSBOX_BACKEND_TIMEOUT_SECONDS, 30}

      approval_mode_default: "${GLASSBOX_APPROVAL_MODE, approve_nodes}"
      node_budget_max_children: ${GLASSBOX_NODE_BUDGET_MAX_CHILDREN, 3}
      node_budget_max_depth: ${GLASSBOX_NODE_BUDGET_MAX_DEPTH, 3}

      artifact_upload_mode: "${GLASSBOX_ARTIFACT_UPLOAD_MODE, s3}"
      approval_poll_interval_seconds: ${GLASSBOX_APPROVAL_POLL_INTERVAL_SECONDS, 5}
      stream_poll_interval_seconds: ${GLASSBOX_STREAM_POLL_INTERVAL_SECONDS, 3}
